name: "Apply org repositories changes"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/repositories.tfvars'
      - 'terraform/repositories/*.tf'
      - '.github/workflows/repos-apply.yml'
      - '.github/workflows/repos-plan.yml'

permissions: {}

concurrency:
  group: terraform-actions-repos

jobs:
  repos-apply-changes:
    name: "Apply org-repositories changes"
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      pull-requests: write  # Required to post terraform plan comments
      id-token: write  # Required for OIDC authentication to AWS
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6  # zizmor: ignore[unpinned-uses]
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: tofu apply
        uses: dflook/tofu-apply@981ee9b40c86a1450134ffa7994c2ae8878de302 # v3.0.0
        env:
          OPENTOFU_VERSION: 1.12.6
          GITHUB_DOT_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}
        with:
          auto_approve: true
          path: "terraform/repositories"
          label: 'repositories'
          variables: |
            github_token = "${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}"
          var_file: |
            terraform/repositories.tfvars
