name: "Plan org repositories changes and list them in a PR"
on:
  pull_request:
    branches:
      - main
    paths:
      - 'terraform/repositories.tfvars'
      - 'terraform/repositories/*.tf'
      - '.github/workflows/repos-apply.yml'
      - '.github/workflows/repos-plan.yml'
      # Do not trigger the plan action when it's been changed since this action has write permissions

permissions: {}

concurrency:
  group: terraform-actions-repos-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  format-terraform-code:
    name: "Check OpenTofu code formatting"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required to post terraform fmt check comments
    timeout-minutes: 4
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: tofu fmt check
        uses: dflook/tofu-fmt-check@8d054dafc07321f2cad9d85d3ebdcf3b451e8aee  # v3.1.2
        env:
          # Authenticate the OpenTofu release download against github.com.
          # Unauthenticated requests share a low per-IP limit across every
          # runner on that host, which intermittently fails the install step.
          # This token needs no scopes.
          GITHUB_DOT_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path: "terraform/repositories"

  repos-plan-changes:
    name: "Plan org-repositories changes and list them in a PR"
    runs-on: ubuntu-latest
    needs: ["format-terraform-code"]
    environment: production
    permissions:
      pull-requests: write  # Required to post terraform plan comments
      contents: read
      id-token: write  # Required for OIDC authentication to AWS
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6  # zizmor: ignore[unpinned-uses]
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: us-east-1

      - name: tofu plan
        uses: dflook/tofu-plan@53b5b01b6eef56cd678401dbe92a0f6ca6b863ff  # v3.1.2
        env:
          OPENTOFU_VERSION: 1.12.6
          GITHUB_DOT_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          add_github_comment: true
          path: "terraform/repositories"
          label: 'repos'
          variables: |
            github_token = "${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}"
          var_file: |
            terraform/repositories.tfvars

  update-site-projects:
    name: "Add new projects to the website project list"
    runs-on: ubuntu-latest
    needs: ["format-terraform-code"]
    # Forks get a read-only token, so they can't be pushed to.
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write  # Required to push the projects.yaml update to the PR branch
    timeout-minutes: 4
    env:
      HEAD_REF: ${{ github.head_ref }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          # Required since we push to the PR branch below.
          persist-credentials: true  # zizmor: ignore[artipacked]

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Add new projects to projects.yaml
        run: |
          base=$(git merge-base origin/main HEAD)
          added=$(python scripts/update_site_projects.py --net --before "$base" --after HEAD)
          [ -z "$added" ] && { echo "No new projects."; exit 0; }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add django-commons.org/data/projects.yaml
          git commit -m "Add $(echo "$added" | paste -sd, - | sed 's/,/, /g') to the website project list"
          git push origin "HEAD:$HEAD_REF"
