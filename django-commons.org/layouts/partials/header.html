<header class="site-header">
  <div class="wrap site-header__inner">
    <a href="/" class="brand" aria-label="Django Commons home">
      <img class="brand__mark brand__mark--light" src="/assets/logo/icon-light.svg" alt="" width="50" height="48">
      <img class="brand__mark brand__mark--dark" src="/assets/logo/icon-dark.svg" alt="" width="50" height="48">
      <span class="brand__name">Django<br>Commons</span>
    </a>

    <nav class="site-nav" id="site-nav">
      <ul class="site-nav__list">
        {{ range site.Menus.main }}
        <li class="site-nav__item{{ if .HasChildren }} has-children{{ end }}">
          {{ if .HasChildren }}
          <button class="site-nav__link site-nav__link--parent" type="button"><span>{{ .Name }}</span><svg class="chev" viewBox="0 0 12 8" width="10" height="7" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" d="M1 1.5 6 6.5 11 1.5"/></svg></button>
          <ul class="site-nav__submenu">
            {{ range .Children }}
            <li><a href="{{ .URL }}" class="site-nav__sublink">{{ .Name }}</a></li>
            {{ end }}
          </ul>
          {{ else }}
          <a href="{{ .URL }}" class="site-nav__link"><span>{{ .Name }}</span></a>
          {{ end }}
        </li>
        {{ end }}
      </ul>
    </nav>

    <div class="site-header__actions">
      <a class="site-nav__github" href="https://github.com/django-commons" target="_blank" rel="noopener" aria-label="Django Commons on GitHub">
        <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      </a>
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
        <svg class="icon-sun" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M12 4.5a1 1 0 0 1-1-1V2a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1Zm0 17a1 1 0 0 1-1-1V19a1 1 0 1 1 2 0v1.5a1 1 0 0 1-1 1ZM4.5 12a1 1 0 0 1-1 1H2a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1Zm17 0a1 1 0 0 1-1 1H19a1 1 0 1 1 0-2h1.5a1 1 0 0 1 1 1ZM6.34 6.34a1 1 0 0 1-1.41 0L3.87 5.28a1 1 0 1 1 1.41-1.41l1.06 1.05a1 1 0 0 1 0 1.42Zm12.73 12.73a1 1 0 0 1-1.41 0l-1.06-1.06a1 1 0 1 1 1.41-1.41l1.06 1.06a1 1 0 0 1 0 1.41ZM6.34 17.66a1 1 0 0 1 0 1.41l-1.06 1.06a1 1 0 1 1-1.41-1.41l1.06-1.06a1 1 0 0 1 1.41 0Zm12.73-12.73a1 1 0 0 1 0 1.41L18 7.4A1 1 0 1 1 16.6 6l1.06-1.06a1 1 0 0 1 1.41 0ZM12 7.5a4.5 4.5 0 1 0 0 9 4.5 4.5 0 0 0 0-9Z"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M20.74 14.51a8.5 8.5 0 0 1-10.6-11A1 1 0 0 0 8.75 2 10 10 0 1 0 22 15.75a1 1 0 0 0-1.26-1.24Z"/></svg>
      </button>
      <button class="nav-toggle" id="nav-toggle" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
    </div>
  </div>
</header>
