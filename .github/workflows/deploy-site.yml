name: Deploy Hugo site

on:
  push:
    branches: [main]
    paths:
      - "django-commons.org/**"
      - ".github/workflows/deploy-site.yml"
      # The project list is built from the tfvars.
      - "terraform/repositories.tfvars"
      - "scripts/build_site_projects.py"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout membership
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so join dates can be read from the tfvars history.
          fetch-depth: 0

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version

      - name: Build project list
        run: python scripts/build_site_projects.py

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.166.0"
          extended: true

      - name: Build site
        working-directory: django-commons.org
        run: hugo --gc --minify

      - name: Deploy to django-commons.github.io
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          personal_token: ${{ secrets.PAGES_DEPLOY_TOKEN }}
          external_repository: django-commons/django-commons.github.io
          publish_branch: gh-pages
          publish_dir: django-commons.org/public
          user_name: "github-actions[bot]"
          user_email: "github-actions[bot]@users.noreply.github.com"
