name: "Apply org membership changes"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/org.tfvars'
      - 'terraform/members/*.tf'
      - '.github/workflows/members-apply.yml'
      - '.github/workflows/members-plan.yml'

permissions: {}

concurrency:
  group: terraform-actions-members

jobs:
  org-apply-changes:
    name: "Apply org membership changes"
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      pull-requests: write  # Required to post terraform plan comments
      id-token: write  # Required for OIDC authentication to AWS
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4  # zizmor: ignore[unpinned-uses]
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: tofu apply
        uses: dflook/tofu-apply@c254eb5b2e48978c05587373100d26b604c2182d # v2.2.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}
        with:
          auto_approve: true
          path: "terraform/members"
          label: 'members'
          variables: |
            github_token = "${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}"
          var_file: |
            terraform/org.tfvars
