name: "Apply org membership changes"

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/org.tfvars'
      - 'terraform/members/*.tf'
      - '.github/workflows/members-apply.yml'
      - '.github/workflows/members-plan.yml'

permissions: {}

concurrency:
  group: terraform-actions-members

jobs:
  org-apply-changes:
    name: "Apply org membership changes"
    runs-on: ubuntu-latest
    environment: production

    permissions:
      contents: read
      pull-requests: write  # Required to post terraform plan comments
      issues: write  # Required to thank new members on their issue
      id-token: write  # Required for OIDC authentication to AWS
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7  # zizmor: ignore[unpinned-uses]
        with:
          # Must be false: the commit/push step below authenticates with its
          # own PAT, and a persisted default GITHUB_TOKEN credential takes
          # precedence over it, causing pushes to be denied.
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6  # zizmor: ignore[unpinned-uses]
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: us-east-1

      - name: tofu apply
        uses: dflook/tofu-apply@cf65a333228c1a4faa7f95bdd4328bf17513e638 # v3.1.3
        env:
          OPENTOFU_VERSION: 1.12.6
          GITHUB_DOT_COM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TERRAFORM_ACTIONS_GITHUB_TOKEN: ${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}
        with:
          auto_approve: true
          path: "terraform/members"
          label: 'members'
          variables: |
            github_token = "${{ secrets.TERRAFORM_MANAGEMENT_GITHUB_TOKEN }}"
          var_file: |
            terraform/org.tfvars

      - name: Thank new member on their issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # ponytail: add_member.yml names branches add-user/<issue>; manual member PRs are skipped
          BRANCH=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" --jq '.[0].head.ref // ""')
          if [[ "${BRANCH}" != add-user/* ]]; then
            echo "Not a new member PR (${BRANCH}), skipping."
            exit 0
          fi
          gh issue comment "${BRANCH#add-user/}" --repo "${GITHUB_REPOSITORY}" --body "Thank you for joining! You'll get an invite email from GitHub. You'll have one week to accept that. If you don't mind, after accepting, can you set your [organization membership as public](https://github.com/orgs/django-commons/people)? This helps Django Commons grow."
