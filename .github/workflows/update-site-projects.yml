name: Add new projects to the website

# When a PR that adds a repository to terraform/repositories.tfvars is merged,
# add that project to django-commons.org/data/projects.yaml (with the merge date
# as `joined`) by opening a follow-up PR for the admins to review.

on:
  push:
    branches: [main]
    paths:
      - "terraform/repositories.tfvars"
  workflow_dispatch:
    inputs:
      before:
        description: "Process commits after this SHA (exclusive). Leave empty for just the latest commit."
        required: false
        type: string

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-site-projects:
    name: "Update projects.yaml"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write  # Push the update branch
      pull-requests: write  # Open the pull request
    env:
      BEFORE_SHA: ${{ github.event.inputs.before || github.event.before }}
      AFTER_SHA: ${{ github.sha }}
      BRANCH_NAME: "site-projects/${{ github.sha }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Needed to diff tfvars across the pushed commits
          # Required since we push a branch later on.
          persist-credentials: true  # zizmor: ignore[artipacked]

      - name: Setup python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Add new projects to projects.yaml
        id: update
        run: |
          added=$(python scripts/update_site_projects.py --before "$BEFORE_SHA" --after "$AFTER_SHA")
          if [ -z "$added" ]; then
            echo "No new projects found."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          {
            echo "projects<<EOF"
            echo "$added"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROJECTS: ${{ steps.update.outputs.projects }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH_NAME"
          git add django-commons.org/data/projects.yaml

          names=$(echo "$PROJECTS" | paste -sd, - | sed 's/,/, /g')
          git commit -m "Add $names to the website project list"
          git push origin "$BRANCH_NAME"

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "Add $names to the website project list" \
            --body "Automatically added after ${AFTER_SHA} changed \`terraform/repositories.tfvars\`.

          The \`joined\` date is the merge date and the description is copied from the tfvars. Please review the description before merging."
